    rule: "When expanding a human seed, keep additions that attach to an established character trait and cut decorative ones that do not."
    scope: "qc-kindergarten.story"
    confidence: "provisional"
    evidence: ["E022"]
    counterexamples: []
    open_question: "One event. May be specific to that story, where an extra figure in the painting would have disturbed the counting joke. Re-check at the next rejected polish."
  - id: "T019"
    rule: "The premise must be something that could not happen in a real kindergarten. Reach for the imaginative and frankly absurd, then anchor it: the absurdity runs on the characters' established logic, never against it."
    scope: "qc-kindergarten.story"
    confidence: "repeated"
    evidence: ["E023", "E024"]
    counterexamples: []
    open_question: "Only the lower bound is evidenced - too everyday gets rejected. Nothing in the corpus shows QC rejecting a premise for being too far out, so the ceiling is unmapped. Same gap as T016, and both rules push the same direction. Record the first rejected absurd premise as a priority."
    note: "Neither half stands alone. Without the first sentence the profile produces slice-of-life, which is what happened in round r01: six outlines executed T001 and T002 well and were rejected 6/6. Without the second sentence this collides with T002 and with the boundary against spectacle that has no character cause."
